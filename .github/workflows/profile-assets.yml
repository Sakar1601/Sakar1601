name: Profile assets

# Rebuilds the SVGs used by README.md (stats come from the GitHub API) and commits them if they changed.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Generate assets
        run: python3 .github/scripts/generate.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          if git diff --quiet -- assets README.md; then
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets README.md
            git commit -m "chore: refresh profile assets"
            git pull --rebase origin main
            git push
          fi
